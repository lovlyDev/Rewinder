name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Wails 2.11's bindings generator does not build with Go 1.25+.
  GO_VERSION: "1.24.x"
  NODE_VERSION: "22"
  WAILS_VERSION: "v2.11.0"

jobs:
  checks:
    name: Lint, type-check, unit tests
    runs-on: windows-latest
    steps:
      - name: Keep LF line endings (gofmt compares bytes)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Icons are generated from the pinned Phosphor version
        working-directory: frontend
        shell: bash
        run: |
          npm run icons
          git diff --exit-code -- src/ui/icon/icons.ts
      - name: svelte-check
        working-directory: frontend
        run: npx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings
      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "Not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Unit tests
        run: go test -count=1 ./...

  integration:
    name: Integration tests (real windows)
    runs-on: windows-latest
    needs: checks
    # GitHub's Windows runners have an interactive desktop, but window focus on
    # shared machines can be flaky; a failure here is reported, not blocking.
    continue-on-error: true
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Placeholder frontend bundle for go:embed
        shell: bash
        run: test -f frontend/dist/.keep
      - name: go test -tags integration
        run: go test -count=1 -tags integration ./...

  build:
    name: Build Rewinder.exe
    runs-on: windows-latest
    needs: checks
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Build
        shell: bash
        run: |
          version="0.0.0-ci.${GITHUB_SHA::7}"
          wails build -clean -trimpath -ldflags "-s -w -X main.version=${version}"
      - uses: actions/upload-artifact@v4
        with:
          name: Rewinder-${{ github.sha }}
          path: build/bin/Rewinder.exe
          retention-days: 14
